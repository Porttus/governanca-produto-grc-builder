name: Atualizar dados do dashboard

on:
  # AGENDAMENTO TEMPORARIAMENTE DESATIVADO — causou perda de dados na Timeline
  # em 25/08 (token do Azure DevOps expirado durante a execução). Reativar
  # assim que a causa raiz for corrigida e um novo token for configurado.
  # schedule:
  #   - cron: '0 11 * * *'
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" no GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rodar refresh de dados (Azure DevOps -> index.html)
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: python3 scripts/refresh_data.py

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Nenhuma mudança nos dados — nada para commitar."
          else
            git add index.html
            git commit -m "Atualização automática de dados ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
