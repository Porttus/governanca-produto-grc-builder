name: Atualizar dados do dashboard

on:
  schedule:
    # Todos os dias às 08:00 e 14:00 (horário de Brasília, UTC-3) = 11:00 e 17:00 UTC
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" no GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rodar refresh de dados (Azure DevOps -> index.html)
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: python3 scripts/refresh_data.py

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Nenhuma mudança nos dados — nada para commitar."
          else
            git add index.html
            git commit -m "Atualização automática de dados ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
